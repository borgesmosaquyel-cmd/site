<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Money - Infoprodutos e Serviços Digitais</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0a0a0c;
            --bg-card: #141416;
            --accent-green: #00ff66;
            --accent-gold: #e6b800;
            --text-main: #ffffff;
            --text-muted: #a0a0a5;
            --border-color: #26262b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            padding-bottom: 80px;
        }

        header {
            background-color: rgba(10, 10, 12, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
        }

        .logo {
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .logo span {
            color: var(--accent-green);
        }

        .security-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            background: rgba(0, 255, 102, 0.1);
            color: var(--accent-green);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 102, 0.2);
        }

        .container {
            padding: 24px 16px;
            max-width: 500px;
            margin: 0 auto;
        }

        /* CARD MODELO INFLUENCIADOR */
        .influencer-product-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
        }

        /* ÁREA DA IMAGEM CENTRALIZADA COM BRILHO NEON */
        .influencer-img-container {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: -15px; /* Sobrepõe levemente o topo do card de preço */
            z-index: 2;
        }

        /* Efeito de iluminação suave ao fundo da imagem */
        .influencer-img-container::before {
            content: '';
            position: absolute;
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, rgba(0, 255, 102, 0.25) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            z-index: -1;
        }

        .influencer-img {
            max-width: 280px;
            width: 85%;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8));
        }

        /* CARD DE PREÇO E AÇÃO (EMBAIXO) */
        .price-box-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px 20px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 1;
        }

        .product-title {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .product-subtitle {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .price-display {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 18px;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .btn-buy-now {
            display: block;
            width: 100%;
            background: linear-gradient(90deg, #ffcc00 0%, var(--accent-green) 100%);
            color: #000000;
            font-weight: 800;
            font-size: 1rem;
            padding: 16px;
            border-radius: 12px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 20px rgba(0, 255, 102, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
            cursor: pointer;
        }

        .btn-buy-now:active {
            transform: scale(0.98);
        }

        footer {
            text-align: center;
            padding: 30px 16px;
            font-size: 0.78rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Start<span>Money</span></div>
        <div class="security-badge">
            <i class="fa-solid fa-shield-halved"></i> Compra Segura
        </div>
    </header>

    <main class="container">

        <!-- PRODUTO 1: PACK SENSI -->
        <div class="influencer-product-card">
            
            <!-- Imagem do influenciador (Sem texto acima) -->
            <div class="influencer-img-container">
                <!-- Substitua o link abaixo pela sua imagem transparente recortada -->
                <img src="URL_DA_SUA_IMAGEM_TRANSPARENTE.png" alt="Pack Sensi" class="influencer-img">
            </div>

            <!-- Card com preço e botão comprar -->
            <div class="price-box-card">
                <div class="product-title">Pack Sensi Exclusivo</div>
                <div class="product-subtitle">Otimização de sensibilidade e mira</div>
                
                <div class="price-display">
                    R$ 67,90
                </div>

                <a href="LINK_DO_SEU_CHECKOUT_AQUI" class="btn-buy-now">
                    COMPRAR AGORA
                </a>
            </div>

        </div>

    </main>

    <footer>
        <p>&copy; 2026 Start Money. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
